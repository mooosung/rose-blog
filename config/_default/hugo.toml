theme = "blowfish"
baseURL = "https://rozenmaier.com/"
defaultContentLanguage = "ja"
languageCode = "ja-JP"
enableRobotsTXT = true
summaryLength = 30
hasCJKLanguage = true
buildDrafts = false
buildFuture = true
enableEmoji = true

[services]
  [services.googleAnalytics]
    ID = "G-BWVN8HEM3J"

[pagination]
  pagerSize = 12

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

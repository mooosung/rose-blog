colorScheme = "rose-noir"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
mainSections = ["posts"]
keywords = ["AI", "投資", "株式", "半導体", "プログラミング", "テック", "日本株", "ニュース"]
robots = "index, follow"
enableStructuredBreadcrumbs = true

defaultBackgroundImage = "https://rozenmaier.com/img/background.jpg"
defaultFeaturedImage = "https://rozenmaier.com/img/roze-banner.png"
backgroundImageWidth = 1200
hotlinkFeatureImage = true

[header]
  layout = "fixed"
  showMenu = true

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "hero"
  homepageImage = "img/roze-banner.png"
  disableHeroImageFilter = true
  showRecent = true
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = "posts"
  cardView = true

[article]
  showDate = true
  showDateUpdated = true
  showDateOnlyInArticle = false
  showAuthor = true
  showHero = true
  heroStyle = "big"
  showBreadcrumbs = true
  showDraftLabel = false
  showEdit = false
  showWordCount = true
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 6

[list]
  showCards = true
  groupByYear = true
  cardView = true
  showSummary = true

[sitemap]
  excludedKinds = []

[taxonomy]
  showTermCount = true
  cardView = false

[author]
  name = "ローゼンマイヤー"
  headline = "AI・投資ニュースをお届けしますわ 🌹"
  bio = "AI・米国株・ETFの投資リサーチブログ。企業IR・決算資料・公的統計などの一次情報にあたり、AIインフラを支える「ツルハシ銘柄」を中心に分析しています。"
  image = "img/avatar.jpg"
  links = []

[advertisement]
  adsense = "pub-7652169193675702"

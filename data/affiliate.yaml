# 証券口座アフィリエイト設定
#
# affiliate: true  … 提携済み。links の計測リンクを使う（rel="nofollow sponsored"）
# affiliate: false … 未提携。公式サイトへの通常リンクとして表示する
#
# ⚠️ 旧実装にあった enabled: フラグはテンプレートから参照されておらず死に設定だった。
#    2026-08-25 に affiliate: へ置き換え、partials/affiliate-cta.html で実際に分岐させている。
#
# 提携状況（2026-08-25 TGアフィリエイト管理画面で実地確認）
#   松井証券   MID 6012 … 提携中。口座開設申込 926円/件（定額）、再訪問90日、本人NG、リスティング不可
#   松井iDeCo  MID 6478 … 提携中。運営管理手数料0円・投信残高ポイント最大1%が訴求点
#   SBI証券    MID 1025 … 未提携（再申請中）
#   楽天証券   MID  738 … 未提携（再申請中）
#   マネックス          … TCSアフィリエイトのみ。TGでは取り扱いなし
brokers:
  - id: matsui
    name: "松井証券"
    catch: "米国株の手数料が業界最安水準"
    points:
      - "米国株4,994銘柄を取扱・SMHなど半導体ETFはNISA成長投資枠も対象"
      - "25歳以下は日本株の取引手数料が0円"
      - "投信残高ポイントは最大年1%還元・iDeCoの運営管理手数料も0円"
    affiliate: true
    # 記事の文脈で出し分ける計測リンク（TGアフィリエイト MID 6012）
    links:
      us_stock: "https://ad2.trafficgate.net/t/r/99/6012/318938_398637"
      nisa: "https://ad2.trafficgate.net/t/r/94/6012/318938_398637"
      toshin: "https://ad2.trafficgate.net/t/r/60/6012/318938_398637"
      # iDeCoのみ別MID(6478)。松井証券iDeCoの計測リンク
      ideco: "https://ad2.trafficgate.net/t/r/28/6478/318938_398637"
    url: "https://ad2.trafficgate.net/t/r/99/6012/318938_398637"
  - id: sbi
    name: "SBI証券"
    catch: "国内最大手・手数料ゼロ革命"
    points:
      - "国内株式売買手数料0円（ゼロ革命）"
      - "米国株の取扱4,000銘柄超・為替コスト業界最安水準"
      - "三井住友カード積立でVポイント還元"
    affiliate: false
    url: "https://www.sbisec.co.jp/"
  - id: rakuten
    name: "楽天証券"
    catch: "楽天ポイントで投資デビュー"
    points:
      - "楽天カード積立でポイント還元・NISAでも対象"
      - "取引ツール「iSPEED」が初心者にも扱いやすい"
      - "日経テレコン（楽天証券版）が無料で読める"
    affiliate: false
    url: "https://www.rakuten-sec.co.jp/"
  - id: monex
    name: "マネックス証券"
    catch: "米国株の分析ツールが強い"
    points:
      - "米国株取扱7,000銘柄超は業界トップクラス"
      - "銘柄スカウター米国株で10年分の業績を可視化"
      - "dカード積立の還元率が高水準"
    affiliate: false
    url: "https://www.monex.co.jp/"

# 記事カテゴリごとに出し分けるCTAの見出し
cta:
  default_heading: "この記事の内容を実践するなら"
  default_lead: "紹介した銘柄・ETFを実際に買うには証券口座が必要ですわ。どこも口座開設・維持は無料ですので、まだの方は開いておくと機会損失を防げますのよ 🌹"

#   ※楽天証券はアクセストレードに存在しない
# ■ TGアフィリエイト（2026-08-31 提携管理タブで実地確認）
#   松井証券   MID 6012 … 提携中。口座開設申込 926円/件、再訪問90日
#                          ⚠️ 2026-09-02にアクセストレード(38376/1,000円)へ乗り換え済み。
